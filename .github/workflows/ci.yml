name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: 后端测试（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: knock_test
          MYSQL_USER: knock
          MYSQL_PASSWORD: knock
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uknock -pknock --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: deliverables/backend/requirements.txt

      - name: 安装依赖
        working-directory: deliverables/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 单元测试
        working-directory: deliverables/backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite://
          AUTO_CREATE_SCHEMA: 'true'
          REDIS_URL: ''
          RATE_LIMIT_ENABLED: 'false'
          GLM_API_KEY: ''
          JWT_SECRET: ci-test-secret-0123456789abcdef012345
        run: python -m pytest -q

      - name: 迁移可在真实 MySQL 上执行
        working-directory: deliverables/backend
        env:
          APP_ENV: dev
          DATABASE_URL: mysql+aiomysql://knock:knock@127.0.0.1:3306/knock_test?charset=utf8mb4
        # alembic 没有 __main__，必须用控制台脚本；pip 安装后会进 PATH
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: 前端构建与类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 生产构建
        working-directory: frontend
        run: npx vite build

      - name: 检查产物
        working-directory: frontend
        run: |
          test -f dist/index.html || (echo "构建产物缺失" && exit 1)
          # 首屏不应包含图表库（应被懒加载拆出）
          if grep -q 'echarts' dist/index.html; then
            echo "警告：index.html 直接引用了 echarts，懒加载可能失效"
          fi
          du -sh dist

  security:
    name: 依赖与密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查是否误提交密钥
        run: |
          if git grep -nE '(GLM_API_KEY|JWT_SECRET)=[A-Za-z0-9_-]{16,}' -- '*.env*' ':!*.example' ; then
            echo "发现疑似真实密钥入库"; exit 1
          fi
          echo "未发现明文密钥"

      - name: Python 依赖漏洞扫描
        working-directory: deliverables/backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict || echo "存在告警，见上方输出"