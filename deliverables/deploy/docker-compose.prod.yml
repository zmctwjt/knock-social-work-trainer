# 叩门 · 社工个案面谈 AI 陪练舱 —— 阶段一单机生产编排
#
# 用法：
#   cp env.example .env && vi .env          # 填密钥（.env 不入库）
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml ps
#
# 拓扑：client → nginx(8080/8443 容器内) → api(8000) → mysql/redis
#       prometheus 抓 api /metrics 与各 exporter；grafana 读 prometheus + loki
# 说明：单机全栈（≤500 在线）。K8s 生产路径见 k8s/；服务间只走容器网络，数据库网段 internal。
# 镜像/端口约定：api 8000（Dockerfile 由 deliverables/backend 提供），nginx 8080/8443（非 root）。
name: knock-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  mysql:
    image: mysql:8.0
    container_name: knock-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      # 8.0 默认 151，按 max_connections 200 的 1.5 倍留余量
      - --max-connections=300
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=1
      # 慢查询阈值 200 ms，与第 8 章巡检口径一致
      - --slow-query-log=1
      - --long-query-time=0.2
      - --log-error-verbosity=2
      - --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 用 root 空口令场景不适用，这里统一走容器内环境变量
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    <<: *hardening
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m
    networks:
      - data

  redis:
    image: redis:7.2.5-alpine
    container_name: knock-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --maxmemory 512mb
        --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    <<: *hardening
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
    networks:
      - data

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    image: knock/api:1.0.0
    container_name: knock-api
    restart: unless-stopped
    # 非敏感配置集中在 .env；敏感项同样只从 .env 注入，绝不写进本文件
    env_file:
      - .env
    environment:
      APP_ENV: prod
      PORT: "8000"
      # 单机阶段不引入连接池中间件：连接数上限 = 工作进程数 × (DB_POOL_SIZE + DB_MAX_OVERFLOW)
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DB}?charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m
    networks:
      - data
      - edge

  nginx:
    image: nginx:1.27-alpine
    container_name: knock-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # 直接挂前端构建产物；原先是 ./static 需手工拷贝，
      # 漏拷就会导致访问 / 返回 403（见部署验证状态 2.1 缺陷 2）
      - ../../frontend/dist:/usr/share/nginx/html:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
    networks:
      - edge

  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: knock-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./prometheus/blackbox.yml:/etc/prometheus/blackbox.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 20s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - edge

  grafana:
    image: grafana/grafana:11.1.5
    container_name: knock-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.knock.example.com
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/knock-overview.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    <<: *hardening
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - edge

  loki:
    image: grafana/loki:3.1.0
    container_name: knock-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    <<: *hardening
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - edge

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: knock-mysqld-exporter
    restart: unless-stopped
    # 只读监控账号由 mysql/init 首次初始化时创建（PROCESS + REPLICATION CLIENT + SELECT）
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128m
    networks:
      - data
      - edge

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: knock-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128m
    networks:
      - data
      - edge

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: knock-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|run)($|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128m
    networks:
      - edge

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: knock-blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128m
    networks:
      - edge

networks:
  # 接入层：nginx / prometheus / grafana 可见
  edge:
    driver: bridge
  # 数据层：数据库与缓存只在此网络，不映射到宿主机
  data:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  redis_data:
  prom_data:
  grafana_data:
  loki_data:
