# 叩门 · Prometheus 抓取配置（单机 Compose 版；K8s 版改 kubernetes_sd，见文件末尾注释）
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: knock-prod
    env: prod

rule_files:
  - /etc/prometheus/alert-rules.yml

# 单机阶段告警由 Grafana 内置 Alerting 消费规则；接入 Alertmanager 时填 127.0.0.1:9093
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # 业务 API：/healthz /readyz /metrics 均在 8000 根路径
  - job_name: knock-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: knock-api
          tier: backend

  - job_name: mysqld-exporter
    static_configs:
      - targets: ["mysqld-exporter:9104"]
        labels:
          service: knock-mysql
          tier: data

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # TLS 证书到期与外部可达性：走 blackbox exporter 的 tls_cert 模块
  - job_name: blackbox-tls
    metrics_path: /probe
    params:
      module: [tls_cert]
    static_configs:
      - targets:
          - https://api.knock.example.com/healthz
          - https://www.knock.example.com/
        labels:
          service: edge
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_api_health]
    static_configs:
      - targets:
          - https://api.knock.example.com/readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

