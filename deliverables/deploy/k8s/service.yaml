apiVersion: v1
kind: Service
metadata:
  name: knock-api
  namespace: knock-prod
  labels:
    app.kubernetes.io/name: knock-api
    app.kubernetes.io/part-of: knock
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: knock-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  sessionAffinity: None
