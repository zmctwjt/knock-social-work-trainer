apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: knock-api
  namespace: knock-prod
  labels:
    app.kubernetes.io/name: knock-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: knock-api
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
  metrics:
    # CPU 目标 70%：AI 网关为 IO 密集，CPU 用于 JSON 校验与序列化
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # 自定义 QPS 指标（需部署 Prometheus Adapter，把
    # sum(rate(http_requests_total[1m])) 暴露为 pods 自定义指标 http_rps；
    # 未就绪前仅按 CPU/内存扩缩）
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_rps
    #     target:
    #       type: AverageValue
    #       averageValue: "25"
