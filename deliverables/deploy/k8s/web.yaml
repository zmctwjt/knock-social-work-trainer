# 前端静态站：nginx-unprivileged 以非 root（101）监听 8080，只读根文件系统
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knock-web
  namespace: knock-prod
  labels:
    app.kubernetes.io/name: knock-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: knock
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: knock-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knock-web
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-cred
      containers:
        - name: web
          image: registry.example.com/knock/knock-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx 需要写 pid 与临时缓冲，全部落在内存盘
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: knock-web
---
apiVersion: v1
kind: Service
metadata:
  name: knock-web
  namespace: knock-prod
  labels:
    app.kubernetes.io/name: knock-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: knock-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
