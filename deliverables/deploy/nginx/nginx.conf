# 叩门 · Nginx 主配置（容器内以非 root 用户 101 运行，容器监听 8080/8443）
# 说明：本文件不使用 user 指令（非 root 主进程下无意义）；pid 与临时目录全部落在可写 tmpfs。
worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── 可写路径：只读根文件系统下唯一可写的是 tmpfs /tmp ──
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # ── 日志：结构化 JSON 直接写 stdout/stderr，由容器日志驱动收集 ──
    log_format json_main escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request_id":"$request_id","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"body_bytes":$body_bytes_sent,"referer":"$http_referer",'
        '"ua":"$http_user_agent","host":"$host","scheme":"$scheme",'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status","trace_id":"$http_x_trace_id"}';
    access_log /dev/stdout json_main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;
    types_hash_max_size 2048;

    # 请求体边界：Nginx 2 MB 兜底，应用层 512 KB 白名单再收一层
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    reset_timedout_connection on;

    # ── TLS 全局参数：只允许 1.2/1.3，优先 1.3 ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.53 valid=300s ipv6=off;
    resolver_timeout 5s;

    # ── 压缩：gzip 在所有发行版可用 ──
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml
               application/vnd.ms-fontobject font/ttf font/otf;
    # 若使用带 ngx_brotli 模块的自编译镜像，取消下四行注释即可启用 brotli
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/json application/javascript image/svg+xml;
    # brotli_static on;

    # ── 限流：按真实客户端 IP ──
    limit_req_zone   $binary_remote_addr zone=api_rl:10m   rate=40r/s;
    limit_req_zone   $binary_remote_addr zone=login_rl:10m rate=10r/m;
    limit_conn_zone  $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ── 反代公共头 ──
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-ID      $request_id;

    include /etc/nginx/conf.d/*.conf;
}
