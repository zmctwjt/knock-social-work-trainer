# 叩门 · 站点配置（证书路径统一 /etc/nginx/certs，生产由 cert-manager 或 ACME 下发）
# 容器内端口：8080 = HTTP（仅跳转与健康检查），8443 = HTTPS（HTTP/2）

upstream knock_api {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ── HTTP：只做跳转与存活探针 ──
server {
    listen 8080 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── api.knock.example.com：业务 API ──
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name api.knock.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 真实 IP：仅信任内网入口（CDN/WAF 回源段），防止伪造 XFF
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_conn conn_per_ip 50;

    # ── 安全响应头 ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ── 探针：直通 API 根路径，不打日志、不限流 ──
    location = /healthz {
        access_log off;
        proxy_pass http://knock_api;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://knock_api;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
    }

    # ── 指标：仅内网可抓 ──
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://knock_api;
        proxy_read_timeout 10s;
    }

    # ── 认证：低频严格限流，防撞库与批量刷游客 token ──
    # 覆盖 login / refresh / guest / logout；/auth/me 为读接口，走下方 /api/ 的普通限流
    location ~ ^/api/v1/auth/(login|refresh|guest|logout)$ {
        limit_req zone=login_rl burst=5 nodelay;
        proxy_pass http://knock_api;
        proxy_read_timeout 30s;
    }

    # ── 业务 API：对流式响应友好，关闭缓冲 ──
    location /api/ {
        limit_req zone=api_rl burst=80 nodelay;
        proxy_pass http://knock_api;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        # SSE / 分块输出禁用 gzip，避免缓冲导致首字延迟
        gzip off;
        add_header Cache-Control "no-store" always;
    }

    # ── 灰度：旧 Node 代理在过渡期并存，按前缀分流 ──
    location /legacy/ {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://knock_api;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}

# ── www.knock.example.com：静态前端（CDN 回源使用同一份产物）──
server {
    listen 8443 ssl;
    http2 on;
    server_name www.knock.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.knock.example.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # 带内容哈希的构建产物：一年不可变
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|ico|map)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # 入口 HTML 绝不缓存，保证发布即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── admin.knock.example.com：管理后台（独立域名便于 WAF 与访问控制）──
server {
    listen 8443 ssl;
    http2 on;
    server_name admin.knock.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 生产建议叠加 IP 白名单或 SSO 网关；此处最小化暴露面
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    location /admin-api/ {
        limit_req zone=api_rl burst=20 nodelay;
        rewrite ^/admin-api/(.*)$ /api/v1/admin/$1 break;
        proxy_pass http://knock_api;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
